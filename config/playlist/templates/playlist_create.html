<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    {% include "header.html" %}
    <h1 class="mb-4 text-center">Создать видео</h1>
    <form action="" method="post" class="d-flex flex-column gap-2 mx-auto" style="max-width: 350px;">
       {% csrf_token %} 
       <input type="text" class="form-control" placeholder="Введите название" name="title">
       <input type="text" class="form-control" placeholder="Введите ссылку" name="link">
       <button type="submit" class="btn btn-primary mt-2">Добавить видео</button>
    </form>
    {% include "footer.html" %}
</body>
</html>
