<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body class=" container py-4">
    {% include "header.html" %}
    <h1 class="mb-4">
        список видео
    </h1>
    {% for video in videos %}
    <article class="mb-4 p-3 shadow-sm">
        <h2 class="h4 card-title">
            {{video.title}}
        </h2>
        <div class="ratio ratio-16x9 mb-3">
            <iframe width="720" height="405" src="https://rutube.ru/play/embed/{{video.embed_code}}/"
                style="border: none;" allow="clipboard-write; autoplay" allowFullScreen></iframe>
        </div>
        <small class="text-secondary">{{video.created_at|date:"d.m.Y"}}</small>
        <form action="{% url 'playlist_like' %}" method="post" class="d-flex align-items-center gap-2 m-0">
            {% csrf_token %}
            <input type="hidden" name="video_id" value="{{video.id}}">
            <button type="submit" class="btn btn-outline-danger btn-sm">❤️</button>
            <span class="text-secondary fw-bold">
                {{video.like}}
            </span>
        </form>
    </article>

    {% empty %}
    <p class="alert alert-info">видео нет</p>
    {% endfor %}
    {% include "footer.html" %}

</body>

</html>
