<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" >
    <h1 class="mb-4">
        список новостей
    </h1>
    {% for post in posts %}
        <article class="card mb-4 p-3 shadow-sm">
            <h2 class="h4 card-title">
                {{post.title}}
            </h2>
            {% if post.picture %}
                <img src="{{post.picture.url}}" alt="" class="img-fluid rounded mb-3">
            {% endif %}
            <p class="card-text">
                {{post.description}}
            </p>
            <p class="text-secondary mb-1">
                likes: {{post.likes|default:"0"}}
            </p>
        </article>
    {% empty %}
            <p class="alert alert-info">постов нет</p>
    {% endfor %}
</body>
</html>
