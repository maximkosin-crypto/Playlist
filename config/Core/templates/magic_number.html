<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="font-family: sans-serif; padding: 20px;">
    <h1>
        игра магическое число
    </h1>
    <p>
        я загадал число от 1 до 2 попробуй отгадать
    </p>
    <form method="post">
        {% csrf_token %}
        <label for="user_number">
            ваше число :
        </label>
        <input type="number" id="user_number" name="user_number" min="1" max="2">
        <button type="submit">
            проверить
        </button>
    </form>

    {% if message %}
    <h2>
        {{message}}
    </h2>
    {% endif %}
</body>

</html>
